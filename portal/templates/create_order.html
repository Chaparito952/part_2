{% extends "base_generic.html" %}

{% block content %}
<h2>Создание заявки на дизайн интерьера</h2>

<form method="post" enctype="multipart/form-data" novalidate style="max-width: 550px;">
    {% csrf_token %}
    {% for field in form %}
        <div class="form-group {% if field.errors %}has-error{% endif %}">
            <label for="{{ field.id_for_label }}">{{ field.label }}:</label>
            {{ field }}
            {{ field.errors }}
        </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Отправить заявку</button>
    <a href="{% url 'profile' %}" class="btn btn-secondary ml-2">Отмена</a>
</form>
{% endblock %}
